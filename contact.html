<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Harell Diaz</title>
    
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="#" class="logo">Harell Diaz</a>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="techstack.html">Tech Stack</a>
            <a href="certifications.html">Certifications</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <section class="contact-section">
        <div class="contact-container">
            <h2 class="heading">Get In <span>Touch</span></h2>
            <p class="contact-subtitle">Have a question or want to collaborate on a project? Send me a message!</p>

            <div class="contact-wrapper">
                <form action="#" class="contact-form">
                    <div class="input-box">
                        <input type="text" placeholder="Full Name" required>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input-box">
                        <input type="number" placeholder="Mobile Number">
                        <input type="text" placeholder="Email Subject">
                    </div>
                    <textarea name="message" cols="30" rows="10" placeholder="Your Message" required></textarea>
                    
                    <button type="submit" class="btn-send">Send Message</button>
                </form>

                <div class="contact-info">
                    <h3>Connect with me</h3>
                    <div class="social-icons">
                        <a href="https://www.facebook.com/share/18mm5cKAUM/" target="_blank" class="facebook">
                            <div class="icon"><i class='bx bxl-facebook'></i></div>
                            <span>Facebook</span>
                        </a>
                        <a href="https://www.instagram.com/ispaykun" target="_blank" class="instagram">
                            <div class="icon"><i class='bx bxl-instagram'></i></div>
                            <span>Instagram</span>
                        </a>
                        <a href="https://www.linkedin.com/in/harell-diaz-78494b40a" target="_blank" class="linkedin">
                            <div class="icon"><i class='bx bxl-linkedin'></i></div>
                            <span>LinkedIn</span>
                        </a>
                        <a href="https://github.com/ISPAYK" target="_blank" class="github">
                            <div class="icon"><i class='bx bxl-github'></i></div>
                            <span>GitHub</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
