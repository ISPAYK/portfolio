<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Harell Diaz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    
    <style>
        .font-orbitron { font-family: "Orbitron", sans-serif; }
        body { font-family: "Poppins", sans-serif; background-color: #0b0c10; color: #fff; }

        /* --- STABLE NAVIGATION BAR (GLOW EFFECT KATULAD NG TECH STACK AT HOME) --- */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 1.5rem 10%; 
            background: transparent;
        }
        .navbar {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        .navbar a { 
            color: #fff; 
            text-decoration: none; 
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        /* Ang nag-iilaw na pink pill button - Active para sa kasalukuyang page */
        .navbar a.active { 
            background: linear-gradient(90deg, #ff007f, #ff00bb);
            color: #fff;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(255, 0, 187, 0.7), 0 0 40px rgba(255, 0, 187, 0.4);
        }

        /* --- CONTACT STRUCTURE ADJUSTMENTS --- */
        .contact-section {
            padding: 100px 10% 4rem 10%;
            max-w: 1300px; 
            margin: 0 auto;
        }
        .contact-container {
            width: 100%;
        }
        .contact-wrapper {
            display: flex;
            gap: 5rem; 
            margin-top: 3rem;
            align-items: flex-start;
        }
        .contact-form {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }
        .input-box {
            display: flex;
            gap: 1.5rem;
            width: 100%;
        }
        .input-box input, .contact-form textarea {
            width: 100%;
            padding: 1.2rem;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-box input:focus, .contact-form textarea:focus {
            border-color: #ff00bb;
            box-shadow: 0 0 15px rgba(255, 0, 187, 0.5);
        }
        .contact-form textarea {
            resize: none;
            height: 200px;
        }
        .btn-send {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(90deg, #ff007f, #ff00bb);
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 0, 187, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            align-self: flex-start;
        }
        .btn-send:hover {
            box-shadow: 0 0 25px rgba(255, 0, 187, 0.8);
            transform: scale(1.02);
        }
        
        .contact-info {
            flex: 1; 
            width: 100%;
        }
        .contact-info h3 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 2rem;
        }
        
        /* --- HIGH STABILITY SOCIAL LINKS --- */
        .social-icons {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 1.5rem;
            width: 100%;
        }
        .social-icons a {
            display: flex;
            align-items: center;
            gap: 2rem; 
            color: #fff;
            padding: 1.2rem 2rem; 
            background: #111827;
            border: 1px solid #374151;
            border-radius: 16px; 
            transition: all 0.3s ease;
            width: 100%; 
            box-sizing: border-box;
            text-decoration: none;
        }
        
        .social-icons .icon {
            font-size: 2.2rem; 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0; 
        }
        .social-icons span {
            font-size: 1.2rem;
            font-weight: 500;
            white-space: nowrap; 
        }

        /* --- HOVER EFFECTS --- */
        .social-icons a.linkedin:hover {
            border-color: #0077B5;
            background: rgba(0, 119, 181, 0.05);
            box-shadow: 0 0 25px rgba(0, 119, 181, 0.5);
            transform: translateY(-5px);
        }
        .social-icons a.github:hover {
            border-color: #ff00bb; 
            background: rgba(255, 0, 187, 0.05);
            box-shadow: 0 0 25px rgba(255, 0, 187, 0.5);
            transform: translateY(-5px);
        }

        /* --- RESPONSIVE ADJUSTMENT --- */
        @media (max-width: 768px) {
            .header { 
                padding: 1.5rem 5%; 
                flex-direction: column; 
                gap: 1rem; 
            }
            .navbar { 
                gap: 0.8rem; 
                flex-wrap: wrap; 
                justify-content: center; 
            }
            .navbar a { 
                font-size: 0.9rem; 
            }
            .navbar a.active { 
                padding: 0.4rem 1rem; 
            }
            
            .contact-section {
                padding: 140px 5% 3rem 5%;
                text-align: center;
            }
            .contact-wrapper {
                flex-direction: column;
                gap: 3.5rem;
                width: 100%;
            }
            .contact-info {
                width: 100%;
            }
            .input-box {
                flex-direction: column;
                gap: 1.5rem;
            }
            .btn-send {
                width: 100%;
            }
            .contact-info h3 {
                font-size: 1.5rem;
                text-align: center;
                border-left: none;
                border-bottom: 2px solid #ff00bb; 
                padding-bottom: 0.5rem;
                display: inline-block;
                margin: 0 auto 1.5rem auto;
            }
            .social-icons a {
                padding: 1.2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo font-orbitron text-2xl font-bold">Harell Diaz</a>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="techstack.html">Tech Stack</a>
            <a href="certifications.html">Certifications</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <section class="contact-section">
        <div class="contact-container">
            <h2 class="text-3xl md:text-5xl font-orbitron font-bold mb-3">Get In <span class="text-[#ff00bb]">Touch</span></h2>
            <p class="text-gray-400 max-w-xl mx-auto md:mx-0 text-sm md:text-base">Have a question or want to collaborate on a project? Send me a message!</p>

            <div class="contact-wrapper">
                <form action="#" class="contact-form">
                    <div class="input-box">
                        <input type="text" placeholder="Full Name" required>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input-box">
                        <input type="number" placeholder="Mobile Number">
                        <input type="text" placeholder="Email Subject">
                    </div>
                    <textarea name="message" placeholder="Your Message" required></textarea>
                    
                    <button type="submit" class="btn-send font-orbitron">Send Message</button>
                </form>

                <div class="contact-info text-left">
                    <h3 class="font-orbitron font-bold text-xl border-l-4 border-[#ff00bb] pl-3">Connect with me</h3>
                    <div class="social-icons">
                        <a href="https://www.linkedin.com/in/harell-diaz-78494b40a" class="linkedin" target="_blank">
                            <div class="icon text-blue-400"><i class="bx bxl-linkedin"></i></div>
                            <span>LinkedIn</span>
                        </a>
                        <a href="https://github.com/ISPAYK" class="github" target="_blank">
                            <div class="icon text-white"><i class="bx bxl-github"></i></div>
                            <span>GitHub</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.querySelector(".contact-form").addEventListener("submit", function(e) {
            e.preventDefault();
            alert("Message Sent! (Integrate your mail carrier logic here)");
        });
    </script>

</body>
</html>
